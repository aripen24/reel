<!DOCTYPE html>
<html lang="th">
<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MISSION REELS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            width: 100dvw;
            height: 100dvh;
            overflow: hidden; /* ป้องกันไม่ให้เกิด Scrollbar */
            position: fixed; /* ล็อกหน้าจอไม่ให้ไถเลื่อนบนมือถือ */
            touch-action: none; /* ป้องกันการใช้เกสเจอร์เลื่อนหน้าจอ */
            overscroll-behavior: none; /* ป้องกันการเด้งสปริงบน iOS */
            background-color: #ffffff;
        }

        .full-screen-iframe {
            width: 100%;
            height: 100%;
            width: 100dvw;
            height: 100dvh;
            border: 0;
            outline: none;
            display: block;
        }
    </style>
</head>
<body>

    <iframe 
        class="full-screen-iframe"
        src="https://script.google.com/macros/s/AKfycbwdFplPwqslyRLq2jtb1kZT3Yv77tTK_kyUvutnaih6z-ghLr1L7-DX351EuWSLaFYW/exec" 
        allow="geolocation *; microphone *; camera *; clipboard-write *"
        allowfullscreen="true"
        scrolling="no">
    </iframe>

</body>
</html>
