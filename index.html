<!DOCTYPE html>
<html lang="th">
<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- ป้องกันการขยายหน้าจอผิดปกติบนมือถือ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MISSION REELS</title>
    <style>
        /* ลบ Margin/Padding ของเบราว์เซอร์ เพื่อให้แสดงผลได้เต็มขอบจริง */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden; /* ป้องกันการเกิด Double Scrollbar */
            background-color: #ffffff;
        }

        /* ปรับ iframe ให้เต็มพื้นที่หน้าจอและรองรับการแสดงผลบนอุปกรณ์เคลื่อนที่ */
        .full-screen-iframe {
            width: 100%;
            height: 100vh; /* เติมเต็มความสูงของหน้าจอ */
            height: 100dvh; /* รองรับ Dynamic Viewport สำหรับ iOS/Android safari bar */
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <iframe 
        class="full-screen-iframe"
        src="https://script.google.com/macros/s/AKfycbwdFplPwqslyRLq2jtb1kZT3Yv77tTK_kyUvutnaih6z-ghLr1L7-DX351EuWSLaFYW/exec" 
        allow="geolocation; microphone; camera; clipboard-write;"
        scrolling="yes">
    </iframe>

</body>
</html>
